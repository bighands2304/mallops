name: Start release

# Cuts release/X.Y.Z from dev, bumps the version, updates CHANGELOG.md
# and opens the PR into main. Pushing the branch publishes the first beta.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (ignored for the very first release, which ships the current version)
        type: choice
        options: [patch, minor, major]
        default: minor

permissions: {}

jobs:
  cut:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Compute next version
        id: v
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          cur=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ -z "$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*')" ]; then
            echo "version=$cur" >> "$GITHUB_OUTPUT"; exit 0
          fi
          IFS=. read -r major minor patch <<< "$cur"
          case "$BUMP" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Bump version
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          sed -i "s/^version = \".*\"/version = \"$V\"/" Cargo.toml
          cargo update --workspace

      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --tag v${{ steps.v.outputs.version }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Create branch and PR
        env:
          # A PAT/App token is needed so the pushed branch and PR trigger other workflows.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git switch -c "release/$V"
          git commit -am "chore(release): v$V"
          git push -u origin "release/$V"
          gh pr create --base main --head "release/$V" \
            --title "chore(release): v$V" \
            --body "Release v$V. Each push to this branch publishes a \`v$V-beta.N\` pre-release. Merge with **Create a merge commit**."
