name: Build binaries

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    outputs:
      exists: ${{ steps.cli.outputs.exists }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      # ponytail: no-op until crates/mallops-cli exists.
      - name: Check for CLI crate
        id: cli
        shell: bash
        run: echo "exists=$([ -f crates/mallops-cli/Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        if: steps.cli.outputs.exists == 'true'
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build archive
        id: build
        if: steps.cli.outputs.exists == 'true'
        shell: bash
        env:
          NAME: mallops-${{ inputs.tag }}-${{ matrix.target }}
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          cargo build --release --locked -p mallops-cli --target "$TARGET"
          mkdir "$NAME"
          cp "target/$TARGET/release/mallops${EXT:-}" LICENSE README.md "$NAME/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a "$NAME.zip" "$NAME"
            asset="$NAME.zip"
          else
            tar czf "$NAME.tar.gz" "$NAME"
            asset="$NAME.tar.gz"
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.cli.outputs.exists == 'true'
        with:
          name: binary-${{ matrix.target }}
          path: ${{ steps.build.outputs.asset }}
          if-no-files-found: error

  upload:
    needs: build
    if: needs.build.outputs.exists == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: Generate checksums and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          LC_ALL=C sha256sum -- * | sort -k2 > ../SHA256SUMS
          mv ../SHA256SUMS ./SHA256SUMS
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" ./*
