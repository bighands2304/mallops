[package]
name = "mallops-std"
description = "Standard blocks of the mallops MLOps framework (one feature flag per block)"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = ["ingest", "preprocess-tabular"]
ingest = ["ingest-csv", "ingest-parquet"]
ingest-csv = ["dep:arrow-csv", "_ingest"]
ingest-parquet = ["_ingest"]
preprocess-tabular = ["_ingest", "_read_parquet", "dep:arrow-cast", "dep:arrow-ord", "dep:arrow-select"]
external = ["dep:nix", "dep:tracing", "tokio/io-util", "tokio/process", "tokio/time"]
train-smartcore = ["_ingest", "_read_parquet", "dep:arrow-cast", "dep:arrow-select", "dep:smartcore"]
predictor = []
package = []
evaluate = ["predictor", "_ingest", "_read_parquet", "dep:arrow-select"]
validate = ["_ingest", "_read_parquet", "dep:arrow-select"]
predict-smartcore = ["predictor"]
predict-external = ["predictor", "tokio/process", "tokio/io-util", "tokio/time"]
# HTTP/JSON inference server (`serve` module); not a DAG block (ADR-0007 D5).
serve-http = ["package", "predictor", "dep:axum", "dep:tempfile", "dep:tracing", "tokio/net", "tokio/time"]
# Reading Parquet back into memory (preprocess, train, evaluate); not a public feature.
_read_parquet = []
# Shared Arrow/Parquet plumbing (Parquet writer, schema subset); not a public feature.
_ingest = ["dep:arrow-array", "dep:arrow-schema", "dep:parquet"]

[dependencies]
mallops-core = { path = "../mallops-core", version = "0.1.0" }
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing = { workspace = true, optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"], optional = true }
tempfile = { workspace = true, optional = true }
# Codecs are for reading external files; the output is always uncompressed.
arrow-array = { version = "60", optional = true }
arrow-cast = { version = "60", optional = true }
arrow-csv = { version = "60", optional = true }
arrow-ord = { version = "60", optional = true }
arrow-schema = { version = "60", optional = true }
arrow-select = { version = "60", optional = true }
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "lz4", "flate2-zlib-rs", "zstd"], optional = true }
# Native classic ML for std/train.smartcore (pure Rust, no BLAS).
smartcore = { version = "0.7", default-features = false, features = ["std"], optional = true }

# Process-group kill for external (safe `killpg`; `unsafe_code` is forbidden).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.32", default-features = false, features = ["signal"], optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[[test]]
name = "predict_external"
path = "tests/predict_external.rs"
harness = false # libtest writes to stdout and would corrupt the NDJSON worker protocol
required-features = ["predict-external"]
