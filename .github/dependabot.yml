version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    commit-message: { prefix: "build" }
    groups:
      cargo: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /docs
    target-branch: dev
    schedule: { interval: monthly }
    commit-message: { prefix: "docs" }
    groups:
      docs: { patterns: ["*"] }
