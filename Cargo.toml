[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/bighands2304/mallops"
authors = ["mallops contributors"]
keywords = ["mlops", "machine-learning", "pipeline", "federated-learning", "edge"]
categories = ["science", "development-tools"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
blake3 = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
ulid = "1"
schemars = "1.2"
yaml_serde = "0.10"
