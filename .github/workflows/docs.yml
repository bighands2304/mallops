name: Docs

# PRs: strict build (broken links fail).  Push on dev: deploy /dev/.
# Releases: called by release.yml to deploy /X.Y/ and move the `latest` alias.
on:
  pull_request:
    paths: ["docs/**", "overrides/**", "mkdocs.yml", "CONTRIBUTING.md"]
  push:
    branches: [dev]
    paths: ["docs/**", "overrides/**", "mkdocs.yml", "CONTRIBUTING.md"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

env:
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    # When called from release.yml, event_name is still 'pull_request': check the tag too.
    if: github.event_name == 'pull_request' && !inputs.tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: Build (strict)
        run: mkdocs build --strict

  deploy:
    if: github.event_name != 'pull_request' || inputs.tag
    permissions:
      contents: write
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 # zizmor: ignore[artipacked] mike deploy --push needs the token
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: Deploy
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true
          if [ -n "$TAG" ]; then
            minor=$(echo "${TAG#v}" | cut -d. -f1,2)
            mike deploy --push --update-aliases "$minor" latest
            mike set-default --push latest
          else
            mike deploy --push dev
            # Until the first release, the site root points to dev.
            mike list | grep -q latest || mike set-default --push dev
          fi
