[package]
name = "mallops-std"
description = "Standard blocks of the mallops MLOps framework (one feature flag per block)"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = ["ingest"]
ingest = ["ingest-csv", "ingest-parquet"]
ingest-csv = ["dep:arrow-csv", "_ingest"]
ingest-parquet = ["_ingest"]
# Shared ingest plumbing (schema check, Parquet writer, source hashing); not a public feature.
_ingest = ["dep:arrow-array", "dep:arrow-schema", "dep:parquet", "dep:blake3", "dep:serde", "dep:serde_json", "dep:tokio"]

[dependencies]
mallops-core = { path = "../mallops-core", version = "0.1.0" }
# 59.x: 60.x requires Rust 1.88 (MSRV is 1.85). Codecs are for reading external files;
# the output is always uncompressed.
arrow-array = { version = "59", optional = true }
arrow-csv = { version = "59", optional = true }
arrow-schema = { version = "59", optional = true }
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "lz4", "flate2-zlib-rs", "zstd"], optional = true }
blake3 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
