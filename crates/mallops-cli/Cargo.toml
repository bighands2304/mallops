[package]
name = "mallops-cli"
description = "The `mallops` command-line interface"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "mallops"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
mallops-core = { path = "../mallops-core", version = "0.1.0" }
mallops-std = { path = "../mallops-std", version = "0.1.0", features = ["external", "train-smartcore", "evaluate", "predict-smartcore", "predict-external", "package"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }

[dev-dependencies]
insta = "1"
tempfile.workspace = true
