site_name: mallops
site_description: Modular MLOps in Rust — from data ingestion to edge devices, one block at a time.
site_url: https://bighands2304.github.io/mallops/
repo_url: https://github.com/bighands2304/mallops
repo_name: bighands2304/mallops
edit_uri: edit/dev/docs/
copyright: Copyright &copy; 2026 The mallops contributors — Apache-2.0

theme:
  name: material
  custom_dir: overrides
  logo: assets/mallops-logo-dark.svg   # header bar is dark brown in both schemes
  favicon: assets/mallops-logo.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: deep orange
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: deep orange
      toggle: { icon: material/weather-sunny, name: Light mode }

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.2/dist/svg-pan-zoom.min.js
  - javascripts/mermaid-zoom.js

extra:
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Specification: SPEC.md
  - Architecture: ARCHITECTURE.md
  - Decisions (ADR):
      - adr/README.md
      - adr/0001-modular-workspace.md
      - adr/0002-arrow-default-interchange.md
      - adr/0003-plugins-wasm-and-grpc.md
      - adr/0004-agnostic-artifacts-and-flavors.md
      - adr/0005-gitflow-and-release.md
      - adr/0006-store-and-lineage-contracts.md
      - adr/0007-core-contracts-revision.md
      - adr/0008-edge-build-profiles-and-on-device-training.md
      - adr/0009-mqtt-blocks-and-serve-transport.md
  - Reference:
      - std/train.external: reference/train-external.md
  - Contributing: contributing.md
  - API reference: https://docs.rs/mallops-core
