name: CI

on:
  push:
    branches: [main, dev, "release/**", "hotfix/**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # mallops-std single-block builds: --all-features never compiles them.
      - name: mallops-std per-feature lint and test
        run: |
          for f in "" ingest-csv ingest-parquet; do
            cargo clippy -p mallops-std --all-targets --no-default-features --features "$f" -- -D warnings
            cargo test -p mallops-std --no-default-features --features "$f"
          done

  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --all-features --locked

  msrv:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Read MSRV
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `+toolchain` overrides rust-toolchain.toml.
      - env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" check --workspace --locked

  docs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --no-deps --all-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          arguments: --all-features
          command-arguments: ${{ github.event_name == 'schedule' && 'advisories' || '' }}

  # Line coverage gate (cargo-llvm-cov). Raise the threshold as coverage grows.
  coverage:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --locked --summary-only --fail-under-lines 85

  # SAST: CodeQL on Rust and on the workflows themselves. Alerts go to the
  # Security tab; any error/warning result fails the job (and ci-ok).
  codeql:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: rust, actions
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          output: sarif-results
          # Fork PRs get a read-only token: analyze but don't upload.
          upload: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'never' || 'always' }}
      - name: Fail on findings
        run: |
          set -euo pipefail
          jq -s -r '.[].runs[].results[] | select(.level == "error" or .level == "warning")
            | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.ruleId): \(.message.text)"' \
            sarif-results/*.sarif | tee findings.txt
          test ! -s findings.txt

  # SCA on the PR diff: new or updated dependencies (cargo, pip, actions) with
  # known vulnerabilities fail the PR. cargo-deny covers the full tree.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: low

  # Static analysis of the GitHub workflows (config in .github/zizmor.yml).
  zizmor:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@bd12b495c90993a4301c73398142281a61499af3 # v0.9.0
        with:
          version: 1.33.0
          advanced-security: false
          min-severity: medium

  # Developer Certificate of Origin: every commit in a PR must carry a
  # Signed-off-by trailer matching its author. Merge commits are rejected on
  # feature PRs; only verified bot commits (dependabot[bot], github-actions[bot])
  # and verified GitHub merge commits on same-repo release/hotfix/main PRs are exempt.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Signed-off-by
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fail=0
          allow_merge=0
          if [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            case "$HEAD_REF" in
              release/*|hotfix/*|main) allow_merge=1 ;;
            esac
          fi
          for c in $(git rev-list "$BASE..$HEAD"); do
            parents="$(git show -s --format='%P' "$c")"
            set -- $parents
            is_merge=0
            if [ "$#" -gt 1 ]; then
              is_merge=1
            fi

            author="$(git show -s --format='%an <%ae>' "$c")"
            email="$(git show -s --format='%ae' "$c")"
            committer_email="$(git show -s --format='%ce' "$c")"

            if [ "$is_merge" = 1 ]; then
              if [ "$allow_merge" = 0 ]; then
                echo "::error::$(git show -s --format='%h %s' "$c") is a merge commit; rebase onto the base branch instead"
                fail=1
                continue
              fi
              if [ "$committer_email" = "noreply@github.com" ]; then
                verified="$(gh api "repos/$BASE_REPO/commits/$c" --jq '.commit.verification.verified' 2>/dev/null || echo false)"
                if [ "$verified" = "true" ]; then
                  continue
                fi
              fi
            fi

            case "$email" in
              "49699333+dependabot[bot]@users.noreply.github.com"|"41898282+github-actions[bot]@users.noreply.github.com")
                verified="$(gh api "repos/$BASE_REPO/commits/$c" --jq '.commit.verification.verified' 2>/dev/null || echo false)"
                if [ "$verified" = "true" ]; then
                  continue
                fi
                ;;
            esac

            if ! git show -s --format=%B "$c" | grep -qiF -- "Signed-off-by: $author"; then
              echo "::error::$(git show -s --format='%h %s' "$c") is missing 'Signed-off-by: $author'"
              fail=1
            fi
          done
          if [ "$fail" = 1 ]; then
            echo "Sign off your commits: git rebase --signoff $BASE && git push --force-with-lease"
            echo "See https://developercertificate.org and CONTRIBUTING.md"
            exit 1
          fi

  # Single required status check for branch protection.
  ci-ok:
    if: always() && github.event_name != 'schedule'
    needs: [fmt, clippy, test, msrv, docs, deny, dco, coverage, codeql, dependency-review, zizmor]
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo ok
